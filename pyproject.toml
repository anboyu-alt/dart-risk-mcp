[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dart-risk-mcp"
version = "1.21.12"
description = "DART 공시 기반 한국 기업 주가조작 위험 분석 MCP 서버"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["dart", "mcp", "korea", "stock", "risk", "disclosure"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.18.6,<2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
# 카탈로그 생성 배치(scripts/catalog/) 전용. MCP 서버 런타임은 이 패키지를
# 쓰지 않으며, 미설치 시 파이프라인이 요약 모드로 degrade한다.
catalog = ["pypdf>=4.0.0"]

[project.scripts]
dart-risk-mcp = "dart_risk_mcp.server:main"

[project.urls]
Homepage = "https://github.com/anboyu-alt/dart-risk-mcp"
Repository = "https://github.com/anboyu-alt/dart-risk-mcp"

[tool.hatch.build.targets.wheel]
packages = ["dart_risk_mcp"]
