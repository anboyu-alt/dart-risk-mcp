<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리스크 뷰어 SE</title>
<style>
:root{
  --bg:#070a0f; --rail:#0b0e14; --panel:#11151d; --cell:#0d1118;
  --line:#1e2530; --line2:#2a333f; --tx:#d7dde6; --dim:#7c8797;
  --dim2:#9fb0c0; --faint:#4a5566; --amber:#e8a33d; --amber2:#f2bc63;
  --red:#e0564a; --green:#4ad295;
  --mono:Consolas,"Cascadia Code","SF Mono",monospace;
  /* 차트 계열 구분 전용 색 10종(--c0~--c9) — ui.js의 renderChart()가 값과
     무관하게 순서로만 배정한다(v0.8.5: 판정 색이 아니다). --red를 여기
     섞지 않는다 — 판정 색과 계열 색은 항상 분리해 둔다. --c9는 SE-7
     Task 3(task-3-brief.md)에서 disclosures 차트의 "정기 보고" 범주를
     "기타"와 구분하려고 추가했다 — 붉은 계열(--red 근처 색상)은 판정
     색처럼 읽힐 수 있어 피하고, 기존 9색과 겹치지 않는 올리브 계열을
     썼다. */
  --c0:#5b8ff9; --c1:#61ddaa; --c2:#f6bd16; --c3:#7262fd; --c4:#78d3f8;
  --c5:#9661bc; --c6:#f6903d; --c7:#008685; --c8:#f08bb4; --c9:#b5c95e;
  /* 사실 강조(마크) 전용 색 — ui.js의 tableEl()이 app.js cellMarks()가
     찍은 셀에 쓴다(v0.8.5: 판정이 아니라 사실의 가시화라 --red를 쓰지
     않는다 — --red는 없지만 위 --c* 계열 색과도 섞지 않는다, 계열
     구분과 강조는 다른 목적). 엔켐 실측(otrCprInvstmntSttus 27건 중
     19건이 여러 규칙에 걸린다)에서 배경을 진하게 채우면 표 대부분이
     칠해져 강조가 배경이 되므로 --mark-bg는 알파 0.10 이하로만 쓴다
     (아래 .mk 참고). */
  --mark:#d98a3a; --mark-bg:rgba(217, 138, 58, 0.08);
  /* 조달건 비례 막대(SE-5a Task 3, ui.js fundChainCardEl) 전용 — 조각
     자체의 배경은 위 --c0~--c9을 재사용하고(판정 색이 아니라 계열
     구분이라는 같은 이유), 이 둘만 새로 정의한다. --fund-bar-track은
     반올림 오차로 조각 폭 합이 100%에 살짝 못 미칠 때 드러나는 트랙
     바탕색이고, --fund-bar-label은 --c0~--c9 채워진 조각 위에 얹는
     라벨 글자색이다 — 두 테마의 --c* 팔레트가 각각 그 테마의 --bg와
     대비되도록 조정돼 있어(다크: --bg 대비 밝은 색, 라이트: --bg 대비
     짙은 색), 라벨 색으로 상대 테마의 --bg를 그대로 쓰면 두 테마 모두
     제 색을 새로 고르지 않고도 무난한 대비를 얻는다. */
  --fund-bar-track:var(--cell); --fund-bar-label:var(--bg);
}
/* 라이트 모드 — 다크 :root의 색상 변수를 하나도 빠짐없이 다시 정의한다.
   일부만 덮으면 배경만 밝아지고 글자는 다크 모드 색(밝은 회색 계열)
   그대로 남아 흰 바탕에 흰 글자처럼 안 보이게 된다(테스트
   test_light_theme_overrides_every_dark_variable이 이걸 기계적으로
   막는다). --mono(글꼴 스택)는 색상이 아니라 테마와 무관해 다시
   정의하지 않는다. ui.js의 applyTheme()이 <html data-theme="light">을
   붙였다 뗐다 하며 이 블록을 켠다 — data-theme는 "dark"/"light" 둘 다
   항상 명시적으로 붙는다(생략되지 않는다). 기본값이 다크로 보이는 건
   속성이 없어서가 아니라 :root 자체가 다크 값이기 때문이다. */
:root[data-theme="light"]{
  --bg:#f4f5f7; --rail:#ffffff; --panel:#ffffff; --cell:#eef0f3;
  --line:#d8dce2; --line2:#c2c8d1; --tx:#1c222b; --dim:#5b6472;
  --dim2:#333c48; --faint:#88909c; --amber:#a8660a; --amber2:#8a5410;
  --red:#b3261e; --green:#1f7a51;
  --c0:#2f5fd0; --c1:#1f9d6e; --c2:#ad8c00; --c3:#5433d6; --c4:#0f8fc4;
  --c5:#7a3fa0; --c6:#cc6a10; --c7:#00615f; --c8:#c2477a; --c9:#6b7a1f;
  --mark:#b5661c; --mark-bg:rgba(181, 102, 28, 0.08);
  /* var(--cell)·var(--bg) 참조 자체는 다크 블록과 같지만, 이 두 변수도
     라이트 블록에서 다시 선언해야 한다 — 그러지 않으면 라이트 모드에서
     :root(다크 값)의 --fund-bar-track·--fund-bar-label이 그대로 남아
     테마 전환이 이 두 변수에서만 조용히 깨진다(다른 모든 --* 변수와
     같은 원칙, test_light_theme_overrides_every_dark_variable이 기계적
     으로 검증한다). */
  --fund-bar-track:var(--cell); --fund-bar-label:var(--bg);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
     font:14px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
#gate{max-width:960px;margin:0 auto;padding:24px}
/* #main은 좌측 목차 + 2단 본문을 담아야 해서 #gate보다 넓게 잡는다
   (예전엔 #gate와 한 규칙을 공유했다 — 폭이 서로 달라져 분리했다). */
#main{max-width:1400px;margin:0 auto;padding:24px}
#main[hidden],#gate[hidden]{display:none}
input,button{font:inherit;background:var(--cell);color:var(--tx);
             border:1px solid var(--line2);border-radius:4px;padding:8px 10px}
button{cursor:pointer}
.sec{border-top:1px solid var(--line);padding:20px 0}
.sec h2{font-size:15px;color:var(--amber2);margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;
      vertical-align:top;max-width:280px;overflow-wrap:anywhere}
th{color:var(--dim2);background:var(--rail);font-weight:normal}
/* SE-8 Task 2 — 공시 목록 표에서만 report_nm(공시명)·flr_nm(공시제출인)
   열 폭을 개별화한다(ui.js tableEl()이 이 두 키에만 붙이는 클래스,
   task-2-brief 요구사항 A). 위 전역 th,td{max-width:280px}는 그대로 두고
   이 두 규칙만 덧붙인다 — 다른 표는 이 클래스가 붙는 열 자체가 없어
   전역 280px를 그대로 적용받는다. 420(wide)+140(narrow)=560은 기존 두
   열의 합(280+280=560)과 같아, 표 전체 폭 예산은 그대로다(가로 스크롤을
   만들지 않는다). */
td.wide{max-width:420px}
td.narrow{max-width:140px}
.doc{color:var(--amber);cursor:pointer;text-decoration:underline dotted}
/* SE-6 Task 3 — 임원 이름 클릭(우측 패널). .doc(공시 원문 열기)와 같은
   "클릭 가능" 시각 신호를 재사용하되 별도 클래스를 쓴다 — 문서를 여는
   것과 사람 패널을 여는 것은 다른 동작이라 같은 색·의미를 겹치면 어느
   쪽을 눌렀는지 구분이 안 된다. 새 CSS 변수는 만들지 않는다(기존 --tx
   재사용, 다크·라이트 양쪽에 이미 정의돼 있다). */
.exec-name{cursor:pointer;text-decoration:underline dotted;color:var(--tx)}
.cap{color:var(--dim2);font-size:12px;margin:0 0 6px;font-family:var(--mono)}
.cap b{color:var(--tx);font-weight:normal}
.fold-btn{font-size:11px;padding:2px 6px;color:var(--dim2)}
.fold-detail td{background:var(--cell);color:var(--dim2);white-space:normal}
.fold-detail b{color:var(--tx);font-weight:normal}
/* 사실 강조 — 얇은 좌측 막대가 주 표기다. 엔켐 실측에서 타법인 출자
   27건 중 19건(70%)이 강조 대상이라, 배경을 진하게 채우면 표 대부분이
   칠해져 강조가 배경이 된다. 글자색은 건드리지 않는다 — 대비가
   무너진다(v0.8.5: 강조는 판정이 아니라 사실의 가시화라 값 자체를
   읽기 어렵게 만들면 안 된다). */
.mk{border-left:3px solid var(--mark);background:var(--mark-bg)}
.mk-legend{margin-top:6px;font-size:12px;color:var(--dim)}
.mk-legend b{color:var(--mark);font-weight:600}
/* 차트는 표 위에 얹는다(표를 대체하지 않는다) — max-width:100%로 그리드
   칸을 넘지 않게 하고, margin-bottom으로 바로 아래 표와 붙지 않게 한다. */
.chart-canvas{max-width:100%;max-height:280px;margin-bottom:10px}
#bar{position:sticky;top:0;background:var(--rail);border-bottom:1px solid var(--line);
     padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--dim2);z-index:5}
#panel{position:fixed;top:0;right:0;height:100%;width:min(560px,92vw);
       background:var(--panel);border-left:1px solid var(--line2);
       transform:translateX(100%);transition:transform .18s ease;
       overflow:auto;padding:52px 20px 20px;z-index:10}
#panel.open{transform:none}
.note{color:var(--dim);font-size:12px}
.warn{color:var(--amber);font-size:12px}
/* 파생 지표(계산값) 블록 — financials 섹션에서만 쓰인다(ui.js
   buildFinancialRatiosBlock). 공시 원본 표와 시각적으로도 구분해야
   한다(SE-4f 판정선: "공시 원본 숫자와 우리 계산값이 구분되지 않으면
   그것도 거짓말이다") — 왼쪽 테두리 색은 값과 무관하게 항상 같은
   색이다(v0.8.5 — 판정 색 --red를 쓰지 않는다, 계열 색과 같은 이유로
   --amber2를 쓴다). */
.derived{border-left:3px solid var(--amber2);padding-left:12px;margin-bottom:16px}
/* 조달건 카드 + 비례 막대(SE-5a Task 3, ui.js fundChainCardEl/buildFundChainBlock).
   Chart.js(vendor/chart.umd.js, 이미 반입돼 있다)를 쓰지 않는 이유: 이 표현은
   "한 조달건의 계획 금액을 용도별로 나눈 비율"이라 축도 시간도 없다 —
   CSS flexbox 비율 막대면 (a) 라벨이 실제 텍스트 노드라 선택·복사가 되고
   (b) canvas destroy 관리(CHART_INSTANCES)가 필요 없고 (c) 다크·라이트
   전환이 위 --fund-bar-* 두 변수만으로 자동 처리된다(task-3-brief.md). */
.fund-chain-card{margin-bottom:20px}
.fund-chain-card h4{font-size:13px;font-weight:normal;color:var(--dim2);
                     font-family:var(--mono);margin:0 0 6px}
/* 조각 배경(--c0~--c9)은 인라인 style로 ui.js가 매긴다(값마다 폭이 달라
   유한한 CSS 클래스로 표현할 수 없다) — 여기서는 트랙 배경·조각 사이
   구분선·라벨 자르기만 정의한다. min-width는 %가 아니라 px다 — %로
   최소 폭을 주면 아주 작은 조각(실측 1.7%)의 폭이 부풀려져 "막대 조각
   폭의 합이 100%" 자체가 거짓이 된다(브리프 "비례가 거짓말이 되는 것"
   경계). px 최소폭은 합계를 건드리지 않고 조각이 완전히 안 보이는
   것만 막는다. */
.fund-bar{display:flex;width:100%;border-radius:3px;overflow:hidden;
          background:var(--fund-bar-track);margin-bottom:8px}
.fund-bar-seg{flex-grow:0;flex-shrink:0;min-width:3px;overflow:hidden;
              white-space:nowrap;padding:4px 6px;font-size:11px;
              font-family:var(--mono);color:var(--fund-bar-label);
              border-right:1px solid var(--bg)}
.fund-bar-seg:last-child{border-right:none}
.fund-hint-list{margin:4px 0 8px;padding-left:18px;font-size:12px}
.fund-hint-list li.doc{cursor:pointer}
/* 복합 패턴 카드(SE-13 Task 3, ui.js buildPatternMatchBlock/patternCardEl).
   공개 뷰어(index.html)의 .patterncard는 판정색 --red로 강조하지만,
   SE는 이 derived 블록 전반의 규칙(위 .derived 주석 — v0.8.5, 값과
   무관하게 항상 같은 --amber2)을 그대로 따른다 — 패턴이 severity별로
   다른 색을 받지 않는다(애초에 severity가 데이터에 없다, Task 2 export
   단계에서 제외). */
.pattern-card{margin-bottom:20px}
.pattern-card h4{font-size:13px;font-weight:normal;color:var(--dim2);
                  font-family:var(--mono);margin:0 0 6px}
.pattern-evidence-list{margin:4px 0 8px;padding-left:18px;font-size:12px}
.pattern-evidence-list li.doc{cursor:pointer}
.pattern-field-evidence{margin:4px 0 8px;padding-left:18px;font-size:12px;color:var(--dim)}
#head{display:flex;align-items:center;gap:12px;justify-content:space-between}
/* #theme-toggle(아래)는 position:fixed로 항상 top:10px;right:12px에
   떠 있고 #panel보다 z-index가 높다.

   버튼 대 버튼(panel-close vs theme-toggle) 겹침은 아래 panel-close의
   margin-top으로 막아뒀지만, 그것만으로는 부족했다 — #panel-body(패널
   본문)는 따로 스타일이 없어 시작점이 #panel의 padding-top 그대로다.
   panel-close는 float라 자기 margin-top(36px)만큼 더 내려가 시작하지만,
   그보다 앞서 배치되는 #panel-body의 첫 줄은 float가 아직 그 높이에
   도달하기 전이라 float를 피해가지 않고 패널 폭 그대로 렌더된다 —
   즉 padding-top이 얕으면 본문 첫 줄이 토글 버튼 뒤로 지나가며 가려진다
   (실측: 패널 본문 첫 줄 y:36px~89px, x~1330px가 토글 y:10px~42.8px,
   x:1254px~1338px, z-index:15(#panel의 10보다 높음)와 겹쳐 공시 원문·
   실명 일부가 안 보였다). panel-close 마진만 조정해선 못 고친다 — 겹친
   건 버튼이 아니라 본문 텍스트였기 때문이다.

   처방: #panel 자체의 padding-top을 토글의 세로 영역(약 10px~43px)보다
   크게 잡는다. 그러면 float(panel-close)든 일반 인라인 텍스트
   (panel-body 첫 줄)든 #panel의 자식은 전부 그 아래에서 시작해 토글과
   겹치지 않는다 — 개별 버튼 위치를 손보는 대신 컨테이너 시작점 자체를
   내리는 쪽이 이후 패널 안에 새 자식이 추가돼도 같은 사고가 재발하지
   않는다. 다크/라이트 토글은 패널이 열려 있어도 계속 눌러야 하므로(패널을
   보는 중에 테마를 바꿀 수 있어야 한다) 토글을 감추거나 옮기지 않았다. */
#panel-close{float:right;margin-top:36px}

/* ── 다크/라이트 토글 버튼 — 로그인 화면에서도 눌러야 하므로 #gate·
   #main 어느 쪽이 보이든 항상 뜨는 고정 위치에 둔다. #panel(z-index:10)
   보다 위에 있어야 패널이 열려도 가려지지 않는다. */
#theme-toggle{position:fixed;top:10px;right:12px;z-index:15;
              font-size:12px;padding:6px 10px}

/* ── 좌측 목차 + 2단 본문 레이아웃 ────────────────────────────────
   #toc는 #main 안(#layout)에 있으므로 #main[hidden] 하나로 같이
   숨는다 — 로그인 화면·로그아웃 정리 지점을 따로 늘리지 않는다. */
#layout{display:flex;gap:28px;align-items:flex-start}
#toc{position:sticky;top:12px;flex:0 0 200px;width:200px;
     font-family:var(--mono);font-size:12px;max-height:calc(100vh - 24px);
     overflow:auto}
.toc-item{padding:4px 8px;color:var(--dim2);cursor:pointer;
          border-left:2px solid transparent;overflow-wrap:anywhere}
.toc-item:hover{color:var(--tx)}
.toc-item.toc-section{padding-left:18px;color:var(--dim);font-size:11px}
.toc-item.active{color:var(--amber2);border-left-color:var(--amber)}
#content{flex:1 1 auto;min-width:0}

/* #body는 그룹(.grp)을 담는 그리드다. .grp 자체는 display:contents로
   자기 박스를 없애 h1·각 섹션(.sec)이 #body 그리드의 직속 아이템이
   되게 한다 — 그래야 개별 섹션 단위로 1칸/2칸(전체 폭)을 고를 수
   있다(.grp가 그대로 그리드 아이템이면 그 안의 넓은 표가 그룹 폭
   절반에 갇힌다).

   .grp 하나만으로는 부족하다 — ui.js의 groupHolder()는 .grp(section)
   안에 중간 홀더 div(id="grp-<제목>", class="grp-holder")를 하나 더 두고
   sectionHolder()가 .sec을 그 홀더에 붙인다(같은 제목의 섹션이 여러
   번 렌더돼도 매번 같은 노드를 찾아 재사용하기 위한 id 앵커). 이
   홀더에도 display:contents를 주지 않으면 #body 그리드의 직속
   아이템은 h1과 이 홀더 박스가 되고 .sec은 홀더의 평범한 블록 자식일
   뿐이라 그리드 아이템이 아니게 된다 — 그러면 .sec.wide{grid-column:
   1/-1}이 완전히 무효화되고, 넓힌 12열 표가 그리드 1칸 폭(2단 중 절반)
   으로 도로 좁아진다(실측 확인된 회귀). */
#body{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.grp,.grp-holder{display:contents}
.grp>h1{grid-column:1/-1;font-size:16px;font-weight:normal;color:var(--dim2);
        border-bottom:1px solid var(--line);margin:24px 0 4px;padding-bottom:6px}
.sec{grid-column:auto}
/* 가로(여러 행) 표가 있는 섹션 — ui.js의 renderSection이 표
   orientation을 보고 이 클래스를 붙인다. 2단 폭 중 한 칸(원래도 좁던
   폭)에 갇히면 앞 태스크에서 넓힌 12열 표가 다시 좁아져 같은 문제가
   재발한다. */
.sec.wide{grid-column:1/-1}

/* ≤1100px에서는 2단이 오히려 각 열을 더 좁혀 읽기 힘들어진다 — 목차를
   상단 가로 목록으로 접고 본문을 1단으로 되돌린다. */
@media (max-width:1100px){
  #layout{display:block}
  #toc{position:static;width:auto;max-height:none;
       display:flex;flex-wrap:wrap;gap:2px 4px;margin-bottom:16px;
       border-bottom:1px solid var(--line);padding-bottom:8px}
  .toc-item.toc-section{padding-left:8px}
  #body{grid-template-columns:1fr}
}
</style>
</head>
<body>
<button id="theme-toggle" aria-label="테마 전환">라이트 모드</button>
<section id="gate">
  <h1>리스크 뷰어 SE</h1>
  <p class="note">인가된 사용자 전용입니다. 계정은 제작자가 발급합니다.</p>
  <div><input id="email" type="email" placeholder="이메일" autocomplete="username"></div>
  <div><input id="password" type="password" placeholder="비밀번호"
              autocomplete="current-password"></div>
  <div><input id="dartkey" type="password" placeholder="DART API 키"
              autocomplete="off"></div>
  <p class="note">DART 키는 이 브라우저에만 저장되며 서버로 보관되지 않습니다.</p>
  <button id="login">로그인</button>
  <p id="gate-msg" class="warn"></p>
</section>

<main id="main" hidden>
<div id="layout">
  <nav id="toc" aria-label="목차"></nav>
  <div id="content">
    <div id="bar"></div>
    <div id="analyze-form" class="sec">
      <input id="company-input" type="text" placeholder="회사명 또는 종목코드">
      <select id="lookback-years">
        <option value="1">최근 1년</option>
        <option value="2">최근 2년</option>
        <option value="3">최근 3년</option>
        <option value="4">최근 4년</option>
        <option value="5">최근 5년</option>
      </select>
      <button id="analyze-btn">분석 시작</button>
      <p id="analyze-msg" class="warn"></p>
    </div>
    <div id="head" class="sec">
      <span id="head-name"></span>
      <button id="actor-btn" hidden>공개기록 보기</button>
    </div>
    <!-- 기업 개요(company_info, STAGE1_SPECS의 "헤더")는 그룹 정렬을 거치는
         일반 섹션이 아니라 여기 고정된 자리에 그린다(design 문서 §7.1:
         섹션 0 "헤더" — 회사명·종목코드·업종·대표자·조회 시점은 본문 맨
         위에 있어야 한다). ui.js의 renderCompanyInfo()가 채운다. -->
    <div id="company-info" class="sec"></div>
    <div id="body"></div>
    <div class="sec">
      <h2>출처·면책</h2>
      <p class="note">
        모든 수치와 이름은 금융감독원 전자공시(DART) 공개 자료입니다.
        이 화면은 사실을 표기할 뿐 위험을 판정하거나 등급을 매기지 않으며,
        투자 판단의 근거가 아닙니다. 동명이인이 있을 수 있습니다.
      </p>
      <button id="logout">로그아웃</button>
    </div>
  </div>
</div>
</main>

<aside id="panel">
  <button id="panel-close" aria-label="닫기">닫기</button>
  <div id="panel-body"></div>
</aside>

<!-- 루트 기준 절대경로여야 한다. vercel.json의 trailingSlash:false가 /se/를
     /se로 되돌리는데, 슬래시 없는 /se에서 상대경로 "app.js"는 /app.js로
     해석돼 404가 난다. 그러면 스크립트가 통째로 로드되지 않아 버튼이
     아무 반응도 하지 않고, 오류를 띄우는 코드조차 없어 화면은 조용하다.
     chart.umd.js는 CDN이 아니라 vendor/에 반입한 파일이며(외부 접속 기록을
     남기지 않기 위해 — docs/tool/se/vendor/README.md 참고), app.js·ui.js가
     전역 Chart를 참조하므로 반드시 그 둘보다 먼저 로드돼야 한다. -->
<script src="/se/vendor/chart.umd.js"></script>
<script src="/se/app.js"></script>
<script src="/se/ui.js"></script>
</body>
</html>
