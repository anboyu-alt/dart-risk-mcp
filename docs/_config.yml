# GitHub Pages(legacy Jekyll) 빌드 설정.
#
# superpowers/ 는 개발 내부 계획·감사 문서라 공개 사이트에 렌더할 이유가 없고,
# 그대로 두면 빌드를 통째로 죽인다. Jekyll의 Liquid 파서는 마크다운 코드펜스
# 안쪽까지 먼저 훑기 때문에, 계획 문서에 인용된 Python f-string이나 Jinja 문법의
# `{{` 를 템플릿 변수 시작으로 오인한다. 닫는 `}}` 를 못 찾으면 그 파일 하나로
# 사이트 전체 빌드가 실패한다.
#
# 실제 사고: 2026-07-27 df77114 로 유입된
# superpowers/plans/2026-07-26-se-2-chunked-orchestrator.md:1069 의
# f'{{"crtfc_key": "{self.KEY}"}}' 한 줄 때문에 pages build #25~#47 이 23연속
# 실패하고 사이트가 07-23 자 내용으로 멈춰 있었다.
#
# 개별 줄을 {% raw %} 로 감싸는 대신 디렉터리째 제외하는 이유: 계획 문서는 계속
# 늘어나고 코드 인용을 담는 것이 본래 목적이라, 같은 패턴이 반복 유입된다.
# 제외해 두면 재발 자체가 없다.
# tool/se/ 는 인가 회원 전용 서비스(SE)의 화면이다. Vercel 배포에서는
# Supabase Auth 게이트 뒤에 있지만, GitHub Pages 는 같은 디렉터리를 인증 없이
# 그대로 서빙해 왔다 — 실측: https://anboyu-alt.github.io/dart-risk-mcp/tool/se/
# 가 200 으로 열렸다.
#
# Pages 에는 /api/se/* 가 없어 화면이 아무 데이터도 못 가져오고(무해), 정적
# 검사가 소스에 비밀값이 없는 것도 막고 있다. 그래도 인가제 서비스의 UI 가
# 인증 없는 주소로 열려 있을 이유가 없으므로 닫는다.
#
# ⚠️ Vercel 배포에는 영향이 없다. vercel.json 의 outputDirectory 가 docs/tool 을
# 직접 가리키고, _config.yml 은 Jekyll 전용이라 Vercel 이 읽지 않는다.
# tool/ 자체는 제외하지 않는다 — /tool/ 의 공개 리스크 뷰어는 무료 공개가 의도다.
exclude:
  - superpowers/
  - tool/se/
